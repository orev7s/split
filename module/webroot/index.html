<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split</title>
<style>
  :root{
    --bg:#0d0f14; --card:#161a22; --line:#232838; --txt:#e7eaf0;
    --dim:#8b93a7; --acc:#4c8dff; --ok:#2fbf71; --warn:#e5a13a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--txt);
       font:15px/1.45 -apple-system,Roboto,"Segoe UI",sans-serif;
       padding:14px 13px 56px;max-width:720px;margin:0 auto}
  h1{font-size:21px;margin:2px 0 2px;letter-spacing:-.3px;display:flex;
     align-items:center;gap:9px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
  .dot.off{background:var(--warn)}
  .sub{color:var(--dim);font-size:12.5px;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:13px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .pill{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:600}
  .pill.on{background:rgba(47,191,113,.14);color:var(--ok)}
  .pill.off{background:rgba(229,161,58,.14);color:var(--warn)}
  .switch{position:relative;width:50px;height:29px;border-radius:30px;
          background:#2a3040;transition:.18s;flex:none;cursor:pointer}
  .switch.on{background:var(--ok)}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;
                 border-radius:50%;background:#fff;transition:.18s}
  .switch.on::after{transform:translateX(21px)}
  input[type=search]{width:100%;padding:11px 13px;border-radius:11px;
    border:1px solid var(--line);background:#10141b;color:var(--txt);
    font-size:15px;outline:none}
  input[type=search]:focus{border-color:var(--acc)}
  .list{max-height:56vh;overflow:auto;margin-top:11px;border-top:1px solid var(--line)}
  .item{display:flex;align-items:center;gap:10px;padding:10px 2px;
        border-bottom:1px solid var(--line)}
  .name{flex:1;min-width:0}
  .name b{display:block;font-weight:500;font-size:14px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .name span{display:block;color:var(--dim);font-size:11px;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:flex;background:#10141b;border:1px solid var(--line);
       border-radius:9px;overflow:hidden;flex:none}
  .seg button{border:0;background:transparent;color:var(--dim);font-size:12px;
              padding:7px 9px;cursor:pointer;font-weight:500}
  .seg button.sel{background:#243049;color:var(--txt)}
  .seg button.sel.ig{background:rgba(76,141,255,.2);color:#9dc0ff}
  .muted{color:var(--dim);font-size:12px}
  .btn{border:1px solid var(--line);background:#10141b;color:var(--txt);
       padding:8px 12px;border-radius:10px;font-size:12.5px;cursor:pointer}
  .btn.danger{color:#ff8b8b;border-color:#4a2a2a}
  .foot{margin-top:16px;color:var(--dim);font-size:11.5px;text-align:center;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
         background:#1e2532;color:var(--txt);padding:9px 15px;border-radius:11px;
         font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;
         border:1px solid var(--line);max-width:88vw;text-align:center}
  .toast.show{opacity:1}
</style>
</head>
<body>

<h1><span class="dot" id="dot"></span>Split</h1>
<p class="sub"><b>Normal</b> lets an app pause others. <b>Overlay</b> lets it play over them.</p>

<div class="card row">
  <div>
    <div style="font-weight:600">Audio focus</div>
    <div class="muted" id="masterNote">…</div>
  </div>
  <div style="display:flex;align-items:center;gap:9px">
    <span class="pill off" id="pill">…</span>
    <div class="switch" id="master"></div>
  </div>
</div>

<div class="card">
  <input type="search" id="q" placeholder="Search apps…" autocomplete="off">
  <div class="list" id="list"><div class="muted" style="padding:14px 2px">Loading…</div></div>
</div>

<div class="card row">
  <div class="muted" id="stats">—</div>
  <button class="btn danger" id="reset">Reset all</button>
</div>

<div class="foot" id="foot">—</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };

  var HAS_KSU = (typeof window.ksu !== "undefined" && window.ksu !== null);
  var enabled = 1, cur = {}, labels = {}, query = "", busy = false;

  function toast(t){
    var el = $("#toast"); el.textContent = t; el.classList.add("show");
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove("show"); }, 1700);
  }

  /* ---------- exec bridge ---------- */
  function kexec(cmd){
    return new Promise(function(resolve){
      if(!HAS_KSU){ resolve({errno:-1, stdout:"", stderr:"no bridge"}); return; }
      var name = "split_cb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
      window[name] = function(errno, stdout, stderr){
        delete window[name];
        resolve({errno: errno, stdout: stdout || "", stderr: stderr || ""});
      };
      try {
        window.ksu.exec(cmd, "{}", name);
      } catch(e) {
        delete window[name];
        resolve({errno:-1, stdout:"", stderr:String(e)});
      }
    });
  }

  function hget(q){
    return fetch("cgi-bin/api?" + q, {cache:"no-store"}).then(function(r){ return r.json(); });
  }

  /* ---------- backend ---------- */
  var Backend = {
    name: HAS_KSU ? "KernelSU" : "Browser",

    state: function(){
      if(HAS_KSU){
        return kexec("cat /data/adb/split/enabled 2>/dev/null; echo '@@@'; cat /data/adb/split/config.tsv 2>/dev/null")
          .then(function(r){
            var parts = (r.stdout || "").split("@@@");
            var en = (parts[0] || "").replace(/\s+/g,"");
            var rules = [];
            (parts[1] || "").split("\n").forEach(function(line){
              var f = line.split("\t");
              if(f.length >= 2 && f[0]) rules.push({p: f[0], m: f[1]});
            });
            return {enabled: en === "1" ? 1 : (en === "0" ? 0 : 1), rules: rules};
          });
      }
      return hget("cmd=state");
    },

    apps: function(){
      if(HAS_KSU){
        return kexec("pm list packages 2>/dev/null | sed 's/^package://'").then(function(r){
          var list = (r.stdout || "").split("\n").filter(Boolean);
          return {apps: list};
        });
      }
      return hget("cmd=apps");
    },

    set: function(pkg, mode){
      if(HAS_KSU){
        return kexec("/data/adb/split/splitctl set " + pkg + " " + mode).then(function(r){
          return {ok: r.errno === 0};
        });
      }
      return hget("cmd=set&pkg=" + encodeURIComponent(pkg) + "&mode=" + mode);
    },

    enable: function(on){
      if(HAS_KSU){
        return kexec("/data/adb/split/splitctl " + (on ? "enable" : "disable"))
          .then(function(r){ return {ok: r.errno === 0}; });
      }
      return hget("cmd=" + (on ? "enable" : "disable"));
    },

    reset: function(){
      if(HAS_KSU){
        return kexec("/data/adb/split/splitctl restore-all").then(function(r){ return {ok: r.errno === 0}; });
      }
      return hget("cmd=restoreall");
    }
  };

  /* ---------- labels (KernelSU only) ---------- */
  function loadLabels(pkgs){
    if(!HAS_KSU || !window.ksu.getPackagesInfo) return Promise.resolve();
    var chunks = [], i;
    for(i = 0; i < pkgs.length; i += 60) chunks.push(pkgs.slice(i, i + 60));
    return Promise.all(chunks.map(function(c){
      return new Promise(function(res){
        try {
          var info = JSON.parse(window.ksu.getPackagesInfo(JSON.stringify(c)));
          (info || []).forEach(function(p){ if(p && p.packageName) labels[p.packageName] = p.appLabel || ""; });
        } catch(e) {}
        res();
      });
    }));
  }

  /* ---------- rendering ---------- */
  function pretty(p){
    var parts = p.split(".");
    return parts.length > 2 ? parts.slice(1).join(".") : p;
  }

  function paintMaster(){
    var on = enabled === 1;
    $("#master").classList.toggle("on", on);
    $("#dot").classList.toggle("off", !on);
    $("#pill").className = "pill " + (on ? "on" : "off");
    $("#pill").textContent = on ? "Active" : "Off";
    $("#masterNote").textContent = on ? "Rules are applied" : "Everything normal";
  }

  function render(){
    var list = $("#list");
    var q = query.toLowerCase();
    var rows = Object.keys(cur).sort(function(a, b){
      var ai = cur[a] === "ignore" ? 0 : 1, bi = cur[b] === "ignore" ? 0 : 1;
      if(ai !== bi) return ai - bi;
      var la = (labels[a] || a).toLowerCase(), lb = (labels[b] || b).toLowerCase();
      return la < lb ? -1 : (la > lb ? 1 : 0);
    }).filter(function(p){
      if(!q) return true;
      return p.toLowerCase().indexOf(q) >= 0 ||
             (labels[p] || "").toLowerCase().indexOf(q) >= 0;
    });

    if(!rows.length){
      list.innerHTML = '<div class="muted" style="padding:14px 2px">No match.</div>';
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function(p){
      var m = cur[p] || "allow";
      var d = document.createElement("div");
      d.className = "item";
      var nm = labels[p] || pretty(p);
      d.innerHTML =
        '<div class="name"><b></b><span></span></div>' +
        '<div class="seg">' +
          '<button data-p="' + p + '" data-m="allow" class="' + (m === "allow" ? "sel" : "") + '">Normal</button>' +
          '<button data-p="' + p + '" data-m="ignore" class="' + (m === "ignore" ? "sel ig" : "") + '">Overlay</button>' +
        '</div>';
      d.querySelector("b").textContent = nm;
      d.querySelector("span").textContent = (nm === p ? "" : p);
      frag.appendChild(d);
    });
    list.innerHTML = "";
    list.appendChild(frag);

    var ig = 0, k;
    for(k in cur) if(cur[k] === "ignore") ig++;
    $("#stats").textContent = ig + " of " + Object.keys(cur).length + " set to overlay";
  }

  /* ---------- events ---------- */
  $("#list").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b || busy) return;
    var p = b.dataset.p, m = b.dataset.m;
    if(cur[p] === m) return;
    cur[p] = m; render();
    Backend.set(p, m).then(function(r){
      toast(r && r.ok === false ? "Failed" : ((labels[p] || pretty(p)) + " → " + m));
    });
  });

  $("#master").addEventListener("click", function(){
    if(busy) return;
    var next = enabled ? 0 : 1;
    enabled = next; paintMaster(); render();
    Backend.enable(next === 1).then(function(){
      toast(next ? "Split on" : "Split off");
    });
  });

  $("#q").addEventListener("input", function(e){ query = e.target.value; render(); });

  $("#reset").addEventListener("click", function(){
    if(!confirm("Reset every app to Normal and clear all rules?")) return;
    toast("Resetting…");
    Backend.reset().then(load).then(function(){ toast("Everything is normal"); });
  });

  /* ---------- boot ---------- */
  function load(){
    return Promise.all([Backend.state(), Backend.apps()]).then(function(res){
      var s = res[0], a = res[1];
      enabled = s.enabled === 1 ? 1 : 0;
      cur = {};
      (a.apps || []).forEach(function(p){ cur[p] = "allow"; });
      (s.rules || []).forEach(function(r){ if(cur[r.p] !== undefined) cur[r.p] = r.m; });
      return loadLabels(Object.keys(cur));
    }).then(function(){
      paintMaster(); render();
      $("#foot").textContent = "Split 2.0.1 · " + Backend.name +
        (HAS_KSU ? " · changes apply instantly" : " · http://" + location.host);
    }).catch(function(){
      $("#list").innerHTML = '<div class="muted" style="padding:14px 2px">Could not reach Split.</div>';
    });
  }

  if(HAS_KSU && window.ksu.fullScreen) { try { window.ksu.fullScreen(false); } catch(e){} }

  load();
})();
</script>
</body>
</html>
